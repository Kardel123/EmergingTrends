<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Post</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #a78bfa;
      --border: rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.18), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(167, 139, 250, 0.2), transparent 40%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin: 0.65rem 0 1.5rem;
      color: var(--muted);
      font-size: 0.98rem;
    }

    form p {
      margin: 0 0 1rem;
      display: grid;
      gap: 0.5rem;
    }

    form label {
      font-weight: 600;
      color: #dbeafe;
    }

    input[type="text"],
    input[type="file"],
    input[type="url"],
    input[type="email"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(15, 23, 42, 0.7);
      color: #f8fafc;
      border-radius: 12px;
      padding: 0.78rem 0.9rem;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.35rem;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      padding: 0.78rem 1.1rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.14s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1021;
      box-shadow: 0 10px 24px rgba(34, 211, 238, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(34, 211, 238, 0.38);
    }

    .btn-ghost {
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.45);
    }

    .btn-ghost:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .helptext,
    form p span,
    form ul.errorlist {
      color: #fecaca;
      font-size: 0.88rem;
      margin: 0;
      list-style: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Create Post</h1>
    <p class="subtitle">Share your idea, image, or update with your readers.</p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="actions">
        <a class="btn btn-ghost" href="/">← Back home</a>
        <button class="btn btn-primary" type="submit">Publish Post</button>
      </div>
    </form>
  </section>
</body>
</html>

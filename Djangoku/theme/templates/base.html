<!-- base.html -->
<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>
    <header>
        <h1>Welcome to My Blog</h1>
    </header>

    <main>
        {% if posts %}
            <ul>
                {% for post in posts %}
                <li>
                    <h2>{{ post.title }}</h2>
                    <p>By: {{ post.author }}</p>
                    {% if post.image %}
                        <img src="{{ post.image.url }}" alt="{{ post.title }}" style="max-width:300px;">
                    {% endif %}
                    <p>{{ post.content }}</p>
                    <small>Published on: {{ post.created_at|date:"F j, Y" }}</small>
                </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No posts available.</p>
        {% endif %}
    </main>
</body>
</html>
